<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vociq Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0a;--s1:#121212;--s2:#1a1a1a;--s3:#222;--s4:#2a2a2a;
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);
  --t1:#f0f0f0;--t2:#999;--t3:#555;
  --green:#1D9E75;--green-bg:rgba(29,158,117,.12);
  --blue:#378ADD;--blue-bg:rgba(55,138,221,.12);
  --red:#e74c3c;--red-bg:rgba(231,76,60,.1);
  --yellow:#f0a500;--orange:#e67e22;
  --r:10px;--font:'Segoe UI',system-ui,sans-serif;--mono:'Consolas',monospace;
}
body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;}

/* Login screen */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.login-card{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;padding:2.5rem;width:360px;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:2rem;}
.login-logo-icon{width:42px;height:42px;border-radius:10px;background:var(--green-bg);border:1px solid rgba(29,158,117,.3);display:flex;align-items:center;justify-content:center;font-size:20px;}
.login-logo-text{font-size:20px;font-weight:700;letter-spacing:-.03em;}
.login-logo-sub{font-size:12px;color:var(--t2);}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
.login-field input{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--t1);font-family:var(--mono);outline:none;transition:border-color .2s,box-shadow .2s;}
.login-field input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(29,158,117,.15);}
.login-btn{width:100%;padding:11px;background:var(--green);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:opacity .15s,transform .1s;margin-top:6px;}
.login-btn:hover{opacity:.88;}
.login-btn:active{transform:scale(.98);}
.login-error{background:var(--red-bg);border:1px solid rgba(231,76,60,.3);border-radius:7px;padding:8px 12px;font-size:12px;color:#ff8080;margin-top:10px;display:none;}

/* App */
.app{display:none;min-height:100vh;flex-direction:column;}
.topbar{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{width:32px;height:32px;border-radius:8px;background:var(--green-bg);border:1px solid rgba(29,158,117,.3);display:flex;align-items:center;justify-content:center;font-size:16px;}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.02em;}
.topbar-badge{background:var(--green-bg);border:1px solid rgba(29,158,117,.3);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--green);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.server-selector{background:var(--s2);border:1px solid var(--bd2);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--t1);font-family:var(--mono);outline:none;min-width:160px;}
.server-selector:focus{border-color:var(--green);}
.topbar-btn{padding:6px 14px;background:var(--s2);border:1px solid var(--bd2);border-radius:7px;color:var(--t2);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;}
.topbar-btn:hover{background:var(--s3);color:var(--t1);}
.topbar-btn.logout{color:var(--red);border-color:rgba(231,76,60,.3);}
.status-pill{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--t2);}
.status-pill-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);}
.status-pill-dot.ok{background:var(--green);box-shadow:0 0 5px rgba(29,158,117,.5);animation:pulse 2.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.content{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%;}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;}
.stat-label{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:700;letter-spacing:-.03em;}
.stat-sub{font-size:11px;color:var(--t3);margin-top:3px;}

/* Sections */
.section{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:20px;overflow:hidden;}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);}
.section-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
.section-btn{padding:6px 14px;background:var(--s2);border:1px solid var(--bd2);border-radius:7px;color:var(--t1);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;display:flex;align-items:center;gap:6px;}
.section-btn:hover{background:var(--s3);}
.section-btn.primary{background:var(--green-bg);border-color:rgba(29,158,117,.4);color:var(--green);}
.section-btn.primary:hover{opacity:.85;}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{border-bottom:1px solid var(--bd);}
th{padding:10px 18px;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;text-align:left;font-weight:500;}
tbody tr{border-bottom:1px solid var(--bd);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.02);}
td{padding:11px 18px;font-size:13px;color:var(--t1);vertical-align:middle;}
.td-mono{font-family:var(--mono);font-size:12px;color:var(--t2);}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:500;}
.badge-ts{background:var(--blue-bg);color:var(--blue);}
.badge-gaming{background:rgba(155,89,182,.12);color:#9b59b6;}
.badge-voice{background:var(--green-bg);color:var(--green);}
.badge-other{background:var(--s3);color:var(--t2);}
.badge-locked{background:rgba(240,165,0,.1);color:var(--yellow);}
.badge-open{background:var(--green-bg);color:var(--green);}
.td-actions{display:flex;gap:6px;justify-content:flex-end;}
.act-btn{padding:4px 10px;border:1px solid var(--bd2);border-radius:6px;background:none;color:var(--t2);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;}
.act-btn:hover{background:var(--s3);color:var(--t1);}
.act-btn.del:hover{border-color:rgba(231,76,60,.4);color:var(--red);background:var(--red-bg);}
.empty-row td{text-align:center;padding:2rem;color:var(--t3);font-size:13px;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;}
.modal{background:var(--s1);border:1px solid var(--bd2);border-radius:14px;width:380px;animation:fadeUp .2s ease;overflow:hidden;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);}
.modal-title{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--t2);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:5px;transition:all .15s;}
.modal-close:hover{background:var(--s3);color:var(--t1);}
.modal-body{padding:20px;}
.f{margin-bottom:14px;}
.f label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
.f input,.f select{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--t1);font-family:var(--mono);outline:none;transition:border-color .2s,box-shadow .2s;}
.f input:focus,.f select:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(29,158,117,.12);}
.f select option{background:var(--s2);}
.f-row{display:flex;gap:10px;}.f-row .f{flex:1;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 20px;}
.btn-cancel{padding:9px 16px;background:var(--s3);border:none;border-radius:8px;font-size:13px;color:var(--t2);cursor:pointer;font-family:var(--font);transition:all .15s;}
.btn-cancel:hover{color:var(--t1);}
.btn-save{padding:9px 20px;background:var(--green);border:none;border-radius:8px;font-size:13px;color:#fff;cursor:pointer;font-family:var(--font);font-weight:600;transition:opacity .15s;}
.btn-save:hover{opacity:.85;}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:10px 20px;font-size:13px;color:var(--t2);opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--red-bg);border-color:rgba(231,76,60,.4);color:#ff8080;}

/* Online users table */
.ping-good{color:var(--green);}
.ping-warn{color:var(--yellow);}
.ping-bad{color:var(--red);}
</style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🎧</div>
      <div>
        <div class="login-logo-text">Vociq</div>
        <div class="login-logo-sub">Admin Panel</div>
      </div>
    </div>
    <div class="login-field">
      <label>Server-Adresse</label>
      <input type="text" id="login-server" placeholder="192.168.1.100:3000" value="localhost:3000"/>
    </div>
    <div class="login-field">
      <label>Admin-Passwort</label>
      <input type="password" id="login-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Anmelden</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🎧</div>
      <div class="topbar-title">Vociq</div>
      <span class="topbar-badge">Admin</span>
    </div>
    <div class="topbar-right">
      <div class="status-pill">
        <div class="status-pill-dot ok" id="conn-dot"></div>
        <span id="conn-label">Verbunden</span>
      </div>
      <button class="topbar-btn" onclick="loadAll()">🔄 Aktualisieren</button>
      <button class="topbar-btn logout" onclick="logout()">Abmelden</button>
    </div>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Online</div>
        <div class="stat-value" id="stat-peers">–</div>
        <div class="stat-sub">Nutzer verbunden</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kanäle</div>
        <div class="stat-value" id="stat-rooms">–</div>
        <div class="stat-sub">Aktive Kanäle</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Server-IPs</div>
        <div class="stat-value" id="stat-servers">–</div>
        <div class="stat-sub">Eingetragen</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Server</div>
        <div class="stat-value" style="font-size:13px;padding-top:4px;" id="stat-addr">–</div>
        <div class="stat-sub" id="stat-version">–</div>
      </div>
    </div>

    <!-- Channels -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">🔊 Kanäle</div>
        <button class="section-btn primary" onclick="showAddChannel()">＋ Kanal erstellen</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Nutzer</th><th>Status</th><th style="text-align:right">Aktionen</th></tr></thead>
          <tbody id="channels-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Online users -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">👥 Online Nutzer</div>
        <button class="section-btn" onclick="loadAll()">Aktualisieren</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Kanal</th><th>IP</th><th>Ping</th><th>Verbunden seit</th></tr></thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Server IPs -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">📋 Server-IPs</div>
        <button class="section-btn primary" onclick="showAddServer()">＋ Server hinzufügen</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Adresse</th><th>Typ</th><th>Notiz</th><th style="text-align:right">Aktionen</th></tr></thead>
          <tbody id="servers-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Modal -->
<div class="modal-bg" id="modal" style="display:none;" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
      <button class="btn-save" onclick="modalOk()">Speichern</button>
    </div>
  </div>
</div>

<script>
let serverAddr='', adminPw='', modalCb=null;
let channels=[], servers=[], roomList=[];
let refreshTimer=null;

const typeLabel={ts:'TeamSpeak',gaming:'Gaming',voice:'Voice',other:'Sonstiges'};
const typeBadge={ts:'badge-ts',gaming:'badge-gaming',voice:'badge-voice',other:'badge-other'};

// ── Login ─────────────────────────────────────────────────────────────────────
async function doLogin(){
  const addr=document.getElementById('login-server').value.trim();
  const pw=document.getElementById('login-pw').value;
  if(!addr||!pw){showLoginError('Bitte alle Felder ausfüllen.');return;}
  const url=addr.startsWith('http')?addr:`http://${addr}`;
  try{
    const r=await fetch(`${url}/api/admin/verify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(!r.ok){showLoginError(`Server-Fehler: HTTP ${r.status}`);return;}
    const d=await r.json();
    if(d.ok){
      serverAddr=url; adminPw=pw;
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='flex';
      document.getElementById('stat-addr').textContent=addr;
      loadAll();
      refreshTimer=setInterval(loadAll,10000);
    } else { showLoginError('Falsches Passwort.'); }
  }catch(e){ showLoginError(`Verbindung fehlgeschlagen: ${e.message}`); }
}

function showLoginError(msg){
  const el=document.getElementById('login-error');
  el.textContent=msg; el.style.display='block';
  setTimeout(()=>el.style.display='none',4000);
}

function logout(){
  clearInterval(refreshTimer);
  serverAddr=''; adminPw='';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('login-pw').value='';
}

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method,path,body){
  const r=await fetch(`${serverAddr}${path}`,{
    method,
    headers:{'Content-Type':'application/json','x-admin-password':adminPw},
    body:body?JSON.stringify(body):undefined
  });
  const text=await r.text();
  try{return JSON.parse(text);}catch{return{error:text};}
}

async function loadAll(){
  try{
    const [health,srv,ch]=await Promise.all([
      fetch(`${serverAddr}/health`).then(r=>r.json()),
      api('GET','/api/servers'),
      api('GET','/api/channels').catch(()=>null)
    ]);
    document.getElementById('stat-peers').textContent=health.peers??'–';
    document.getElementById('stat-rooms').textContent=health.rooms??'–';
    document.getElementById('stat-version').textContent=`v${health.version||'?'}`;
    document.getElementById('conn-dot').className='status-pill-dot ok';
    document.getElementById('conn-label').textContent='Verbunden';

    servers=Array.isArray(srv)?srv:[];
    document.getElementById('stat-servers').textContent=servers.length;
    renderServers();

    // Get rooms via REST if available, else show count
    const roomsData=await fetch(`${serverAddr}/api/rooms-info`).then(r=>r.json()).catch(()=>null);
    if(roomsData)roomList=roomsData;
    renderChannels(roomsData);
    renderUsers(roomsData);
  }catch(e){
    document.getElementById('conn-dot').className='status-pill-dot';
    document.getElementById('conn-label').textContent='Getrennt';
  }
}

// ── Channels ──────────────────────────────────────────────────────────────────
function renderChannels(rooms){
  const tbody=document.getElementById('channels-body');
  if(!rooms||!rooms.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="4">Keine Kanäle vorhanden</td></tr>';
    return;
  }
  tbody.innerHTML=rooms.map(r=>`
    <tr>
      <td><b>${esc(r.id)}</b></td>
      <td><span style="color:var(--t2)">${r.members||0} Nutzer</span></td>
      <td><span class="badge ${r.locked?'badge-locked':'badge-open'}">${r.locked?'🔒 Gesperrt':'🔊 Offen'}</span></td>
      <td class="td-actions">
        <button class="act-btn del" onclick="deleteChannel('${esc(r.id)}')">🗑 Löschen</button>
      </td>
    </tr>
  `).join('');
}

function showAddChannel(){
  openModal('Kanal erstellen',`
    <div class="f"><label>Kanalname</label><input id="mf-ch" placeholder="z.B. Allgemein"/></div>
    <div class="f"><label>Passwort (optional)</label><input id="mf-chpw" type="password" placeholder="Leer = kein Passwort"/></div>
  `,async()=>{
    const roomId=document.getElementById('mf-ch').value.trim();
    const password=document.getElementById('mf-chpw').value;
    if(!roomId){toast('Kanalname fehlt',true);return false;}
    const d=await api('POST','/api/channels',{roomId,password});
    if(d.error){toast(`Fehler: ${d.error}`,true);return false;}
    toast(`Kanal "${roomId}" erstellt`);
    loadAll(); return true;
  });
}

async function deleteChannel(id){
  if(!confirm(`Kanal "${id}" wirklich löschen?`))return;
  const d=await api('DELETE',`/api/channels/${encodeURIComponent(id)}`);
  if(d.error){toast(`Fehler: ${d.error}`,true);return;}
  toast(`Kanal "${id}" gelöscht`); loadAll();
}

// ── Online users ──────────────────────────────────────────────────────────────
function renderUsers(rooms){
  const tbody=document.getElementById('users-body');
  const users=[];
  if(rooms)rooms.forEach(r=>r.users?.forEach(u=>users.push({...u,channel:r.id})));
  if(!users.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="5">Keine Nutzer online</td></tr>';
    return;
  }
  tbody.innerHTML=users.map(u=>{
    const ping=u.ping||0;
    const pc=ping<80?'ping-good':ping<200?'ping-warn':'ping-bad';
    const dur=u.connectedSince?formatDur(Date.now()-u.connectedSince):'–';
    return `<tr>
      <td><b>${esc(u.name)}</b>${u.muted?'<span style="color:var(--red);margin-left:6px;font-size:11px;">🔇 stumm</span>':''}</td>
      <td class="td-mono">${esc(u.channel)}</td>
      <td class="td-mono">${esc(u.ip||'–')}</td>
      <td class="td-mono ${pc}">${ping}ms</td>
      <td class="td-mono">${dur}</td>
    </tr>`;
  }).join('');
}

// ── Server IPs ────────────────────────────────────────────────────────────────
function renderServers(){
  const tbody=document.getElementById('servers-body');
  if(!servers.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="5">Keine Server eingetragen</td></tr>';
    return;
  }
  tbody.innerHTML=servers.map(s=>`
    <tr>
      <td><b>${esc(s.name)}</b></td>
      <td class="td-mono">${esc(s.ip)}${s.port?':'+esc(s.port):''}</td>
      <td><span class="badge ${typeBadge[s.type]||'badge-other'}">${typeLabel[s.type]||'Sonstiges'}</span></td>
      <td style="color:var(--t3);font-size:12px;">${esc(s.note||'–')}</td>
      <td class="td-actions">
        <button class="act-btn" onclick="showEditServer('${s.id}')">✏ Bearbeiten</button>
        <button class="act-btn del" onclick="deleteServer('${s.id}')">🗑</button>
      </td>
    </tr>
  `).join('');
}

function showAddServer(id){
  const s=id?servers.find(x=>x.id===id):null;
  openModal(s?'Server bearbeiten':'Server hinzufügen',`
    <div class="f"><label>Name</label><input id="mf-sn" value="${s?esc(s.name):''}" placeholder="z.B. Unser TS3"/></div>
    <div class="f-row">
      <div class="f"><label>IP-Adresse</label><input id="mf-si" value="${s?esc(s.ip):''}" placeholder="192.168.1.1"/></div>
      <div class="f" style="max-width:100px"><label>Port</label><input id="mf-sp" value="${s&&s.port?esc(s.port):''}" placeholder="9987"/></div>
    </div>
    <div class="f"><label>Typ</label><select id="mf-st">
      <option value="ts"${s?.type==='ts'?' selected':''}>TeamSpeak</option>
      <option value="gaming"${s?.type==='gaming'?' selected':''}>Gaming</option>
      <option value="voice"${s?.type==='voice'?' selected':''}>Voice</option>
      <option value="other"${s?.type==='other'?' selected':''}>Sonstiges</option>
    </select></div>
    <div class="f"><label>Notiz</label><input id="mf-sno" value="${s?esc(s.note||''):''}" placeholder="Optional"/></div>
  `,async()=>{
    const name=document.getElementById('mf-sn').value.trim();
    const ip=document.getElementById('mf-si').value.trim();
    if(!name||!ip){toast('Name und IP sind Pflicht',true);return false;}
    const body={name,ip,port:document.getElementById('mf-sp').value.trim(),type:document.getElementById('mf-st').value,note:document.getElementById('mf-sno').value.trim()};
    const d=await api(id?'PUT':'POST',id?`/api/servers/${id}`:'/api/servers',body);
    if(d.error){toast(`Fehler: ${d.error}`,true);return false;}
    toast(id?'Server aktualisiert':'Server hinzugefügt'); loadAll(); return true;
  });
}
function showEditServer(id){showAddServer(id);}
async function deleteServer(id){
  if(!confirm('Server wirklich löschen?'))return;
  const d=await api('DELETE',`/api/servers/${id}`);
  if(d.error){toast(`Fehler: ${d.error}`,true);return;}
  toast('Server gelöscht'); loadAll();
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(title,body,onOk){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  modalCb=onOk;
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>{const f=document.querySelector('#modal-body input');if(f)f.focus();},50);
}
function closeModal(){document.getElementById('modal').style.display='none';modalCb=null;}
function bgClose(e){if(e.target.id==='modal')closeModal();}
async function modalOk(){if(modalCb){const r=await modalCb();if(r!==false)closeModal();}else closeModal();}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&document.getElementById('modal').style.display==='flex'&&e.target.tagName!=='SELECT')modalOk();
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastT;
function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.toggle('err',!!err);t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatDur(ms){const s=Math.floor(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m '+s%60+'s';return Math.floor(m/60)+'h '+m%60+'m';}
</script>
